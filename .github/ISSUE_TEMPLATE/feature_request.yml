name: ✨ 기능 요청
description: 새 기능이나 더 나은 방법을 제안해 주세요
title: "[기능] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        아이디어 고맙습니다! **무엇이 불편한지**를 먼저 적어 주시면 더 좋은 방법을 함께 찾기 쉽습니다.

  - type: textarea
    id: problem
    attributes:
      label: 어떤 점이 불편한가요?
      description: 지금은 어떻게 하고 있고, 무엇이 번거로운지
      placeholder: "PR 을 만들 때마다 브라우저를 열어야 해서 …"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 원하는 동작
      description: 어디서(화면·메뉴) 무엇을 누르면 어떻게 되면 좋을지
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 생각해 본 다른 방법
      description: 다른 앱(GitKraken · Fork · Sourcetree · VS Code 등)에서는 어떻게 하는지도 좋습니다

  - type: checkboxes
    id: platform
    attributes:
      label: 필요한 플랫폼
      options:
        - label: macOS
        - label: Windows

  - type: textarea
    id: extra
    attributes:
      label: 참고 자료
      description: 화면 그림·스케치·스크린샷을 끌어다 놓아 주세요(회사 정보는 가려 주세요)

  - type: checkboxes
    id: contribute
    attributes:
      label: 함께하기
      options:
        - label: 직접 PR 을 보내 볼 생각이 있습니다([기여 안내](https://github.com/Gitrochi/Gitrochi/blob/main/CONTRIBUTING.md))
