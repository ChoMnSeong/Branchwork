name: 💬 질문 · 도움
description: 쓰는 방법이 궁금하거나 설정이 잘 안 될 때
title: "[질문] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        [README 사용법](https://github.com/Gitrochi/Gitrochi#사용법)과 [기능 자세히](https://github.com/Gitrochi/Gitrochi#기능-자세히)에 답이 있을 수 있습니다.

  - type: dropdown
    id: platform
    attributes:
      label: 플랫폼
      options:
        - macOS
        - Windows
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: 궁금한 점
      description: 하려는 일과, 해 본 것을 적어 주세요
    validations:
      required: true
