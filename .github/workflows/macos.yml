name: macOS

# PR: 빌드 확인. v* 태그: 유니버설 빌드 → 업데이트 서명 → 그 태그의 릴리스(없으면 초안)에 올리기.
# main 은 PR 로만 바뀌므로(이미 PR 에서 빌드함) 합친 뒤 main 에서 다시 돌리지 않는다.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["macos/**", "tools/gitch/**", ".github/workflows/macos.yml"]
  workflow_dispatch:

# 같은 PR 에 새로 푸시하면 돌던 실행은 취소
concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 빌드
    if: github.ref_type != 'tag'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 빌드
        run: macos/build.sh

      - name: 앱 올리기
        uses: actions/upload-artifact@v4
        with:
          name: gitrochi-macos
          path: macos/build/Gitrochi.app

  # gitch(앱에 함께 들어가는 셸 도구): macOS 기본 bash 3.2 로 전체 테스트(임시 HOME · 가짜 ssh/gh/curl/원격)
  gitch:
    name: gitch 테스트
    if: github.ref_type != 'tag'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 테스트
        run: tools/gitch/tests/run.sh

      # 정적 검사(경고 이상) — 로컬과 같은 최신 shellcheck. 테스트가 실패해도 따로 결과를 보인다
      - name: shellcheck
        if: ${{ !cancelled() }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          shellcheck --version | sed -n 2p
          shellcheck -S warning tools/gitch/gitch tools/gitch/install.sh tools/gitch/tests/*.sh

  # 릴리스에 파일을 올려야 해서 쓰기 권한은 태그 실행에만 준다.
  # 앱의 업데이트 확인은 초안을 보지 않으므로, 관리자가 노트를 쓰고 '게시'해야 사용자에게 간다.
  release:
    name: 배포 파일
    if: github.ref_type == 'tag'
    environment: release
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: write
    # Windows(windows.yml 「릴리스에 올리기」)와 같은 그룹으로 하나씩 돈다: 같은 태그의 초안이 둘 생기지 않게
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 태그와 앱 버전 맞추기
        run: |
          app="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' macos/Resources/Info.plist)"
          if [ "v$app" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그 $GITHUB_REF_NAME 와 Info.plist 버전 $app 이 다릅니다. 버전을 올린 커밋에 태그를 다세요."
            exit 1
          fi

      - name: 배포 파일 (유니버설 · 업데이트 서명)
        env:
          # release 환경에 이름을 바꾸기 전의 BRANCHWORK_UPDATE_KEY 만 있으면 그것을 쓴다(같은 열쇠)
          GITROCHI_UPDATE_KEY: ${{ secrets.GITROCHI_UPDATE_KEY || secrets.BRANCHWORK_UPDATE_KEY }}
        run: macos/build.sh release

      # 앱 없이 gitch 만 쓰는 사람용: tools/gitch/install.sh 와 gitch self-update 가 받는다(아래에서 다른 배포 파일과 함께 올림)
      - name: gitch (CLI 만)
        run: |
          cp tools/gitch/gitch macos/dist/gitch
          (cd macos/dist && shasum -a 256 gitch > gitch.sha256)

      - name: 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --verify-tag --title "Gitrochi ${tag#v}" --notes ""
          gh release upload "$tag" macos/dist/* --clobber
          {
            echo "### 맥 배포 파일 → $tag"
            echo '```'
            cat macos/dist/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 배포 파일 올리기
        uses: actions/upload-artifact@v4
        with:
          name: gitrochi-macos-release
          path: macos/dist/*
