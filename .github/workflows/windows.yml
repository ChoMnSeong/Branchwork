name: Windows

on:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  build:
    name: 빌드 · 자동 점검
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "windows/src-tauri -> target"

      - name: 패키지 설치
        run: npm ci

      - name: 타입 검사 · 단위 테스트
        run: |
          npx tsc --noEmit
          npx vitest run

      - name: 빌드 (설치 파일 + 업데이트 서명)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build
          else
            # 서명 열쇠가 없는 곳(포크 PR 등)에서는 업데이트 파일 없이 빌드
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: 설치 파일 올리기
        uses: actions/upload-artifact@v4
        with:
          name: branchwork-windows
          path: |
            windows/src-tauri/target/release/bundle/nsis/*.exe
            windows/src-tauri/target/release/bundle/nsis/*.sig
            windows/src-tauri/target/release/branchwork.exe

      - name: 점검용 빌드(업데이트 서버 http 허용 — 배포 파일과는 별개)
        shell: bash
        run: |
          # 가짜 업데이트 서버(http://127.0.0.1)로 서명 확인을 시험하려고 http 허용 + 낮은 버전(0.0.1)으로 다시 빌드한다.
          # 배포 파일(위에서 올린 설치 파일)은 https 만 쓴다.
          npx tauri build --no-bundle --config '{"version":"0.0.1","bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"dangerousInsecureTransportProtocol":true}}}'

      - name: 테스트 저장소 만들기
        shell: bash
        run: |
          ROOT="$(cygpath -m "$RUNNER_TEMP")/st"
          bash tests/make-test-repo.sh "$ROOT/repo"
          echo "ST_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: WSL 준비(Ubuntu)
        id: wsl
        continue-on-error: true
        uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 1

      - name: WSL 에 가짜 claude 두기
        if: steps.wsl.outcome == 'success'
        continue-on-error: true
        shell: wsl-bash {0}
        run: |
          # 윈도에서 받은 파일이라 줄 끝(CR)을 지우고 둔다
          tr -d '\r' < tests/fake-claude.sh > /usr/local/bin/claude
          chmod 755 /usr/local/bin/claude
          claude --version

      - name: 자동 점검 (실제 앱 실행)
        shell: pwsh
        run: |
          # AI 연결·자동 업데이트 점검용 가짜 서버(방금 만든 설치 파일과 서명을 업데이트로 내놓는다)
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          $mockArgs = @("tests/mock-ai-server.mjs", "18080")
          if (Test-Path "$($setup.FullName).sig") { $mockArgs += @("`"$($setup.FullName)`"", "`"$($setup.FullName).sig`"") }
          $mock = Start-Process -FilePath node -ArgumentList $mockArgs -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "해상도 변경 불가: $_" }
          $exe = Resolve-Path "src-tauri/target/release/branchwork.exe"
          $result = "$env:ST_ROOT/selftest-result.json"
          $env:BRANCHWORK_SELFTEST = "$env:ST_ROOT/repo"
          $p = Start-Process -FilePath $exe -PassThru
          $deadline = (Get-Date).AddSeconds(240)
          while (-not (Test-Path $result) -and (Get-Date) -lt $deadline -and -not $p.HasExited) { Start-Sleep -Milliseconds 500 }
          Start-Sleep -Seconds 3
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:ST_ROOT/selftest.png")
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (-not $mock.HasExited) { Stop-Process -Id $mock.Id -Force }
          if (-not (Test-Path $result)) { Write-Error "자동 점검 결과가 없습니다(앱이 시작하지 못했거나 멈춤)"; exit 1 }
          $r = Get-Content $result -Raw -Encoding utf8 | ConvertFrom-Json
          foreach ($c in $r.checks) { $mark = if ($c.ok) { "OK  " } else { "FAIL" }; Write-Host "$mark $($c.name) $(if (-not $c.ok) { $c.detail })" }
          if (-not $r.ok) { Write-Error "자동 점검 실패"; exit 1 }

      - name: 점검 결과 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: |
            ${{ env.ST_ROOT }}/selftest-result.json
            ${{ env.ST_ROOT }}/selftest.png
          if-no-files-found: ignore

