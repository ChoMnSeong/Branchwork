name: Windows

on:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  build:
    name: 빌드 · 자동 점검
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "windows/src-tauri -> target"

      - name: 패키지 설치
        run: npm ci

      - name: 타입 검사 · 단위 테스트
        run: |
          npx tsc --noEmit
          npx vitest run

      - name: 빌드 (설치 파일)
        run: npx tauri build

      - name: 테스트 저장소 만들기
        shell: bash
        run: |
          ROOT="$(cygpath -m "$RUNNER_TEMP")/st"
          bash tests/make-test-repo.sh "$ROOT/repo"
          echo "ST_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: 자동 점검 (실제 앱 실행)
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "해상도 변경 불가: $_" }
          $exe = Resolve-Path "src-tauri/target/release/branchwork.exe"
          $result = "$env:ST_ROOT/selftest-result.json"
          $env:BRANCHWORK_SELFTEST = "$env:ST_ROOT/repo"
          $p = Start-Process -FilePath $exe -PassThru
          $deadline = (Get-Date).AddSeconds(240)
          while (-not (Test-Path $result) -and (Get-Date) -lt $deadline -and -not $p.HasExited) { Start-Sleep -Milliseconds 500 }
          Start-Sleep -Seconds 3
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:ST_ROOT/selftest.png")
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (-not (Test-Path $result)) { Write-Error "자동 점검 결과가 없습니다(앱이 시작하지 못했거나 멈춤)"; exit 1 }
          $r = Get-Content $result -Raw -Encoding utf8 | ConvertFrom-Json
          foreach ($c in $r.checks) { $mark = if ($c.ok) { "OK  " } else { "FAIL" }; Write-Host "$mark $($c.name) $(if (-not $c.ok) { $c.detail })" }
          if (-not $r.ok) { Write-Error "자동 점검 실패"; exit 1 }

      - name: 점검 결과 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: |
            ${{ env.ST_ROOT }}/selftest-result.json
            ${{ env.ST_ROOT }}/selftest.png
          if-no-files-found: ignore

      - name: 설치 파일 올리기
        uses: actions/upload-artifact@v4
        with:
          name: branchwork-windows
          path: |
            windows/src-tauri/target/release/bundle/nsis/*.exe
            windows/src-tauri/target/release/branchwork.exe
